name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumasmodels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumasmodels_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumasmodels_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lumasmodels_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumasmodels_test?schema=public
      APP_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace @lumas/api
      - run: npm run prisma:deploy --workspace @lumas/api
      - run: npm run prisma:seed
      - run: npm run coverage
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep-invert "composição visual"
      - name: Publicar evidências E2E em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
