services:
  - type: web
    name: lumasmodels-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace @lumas/api && npm run build:api && npm run prisma:deploy --workspace @lumas/api && npm run prisma:seed --workspace @lumas/api
    startCommand: npm run start --workspace @lumas/api
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: BOOTSTRAP_MANAGER_USERNAME
        sync: false
      - key: BOOTSTRAP_MANAGER_DISPLAY_NAME
        sync: false
      - key: BOOTSTRAP_MANAGER_PASSWORD
        sync: false
